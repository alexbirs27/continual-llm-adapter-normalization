method: inclora
model_name: Qwen/Qwen2.5-0.5B

lora:
  r: 8
  alpha: 32
  dropout: 0.1
  target_modules:
    - q_proj
    - v_proj

training:
  lr: 3e-4
  epochs_per_task: 1
  batch_size: 2
  gradient_accumulation_steps: 4
  max_seq_length: 96
  lambda_1: 0.0
  lambda_2: 0.0
  # Tiny smoke-test config: ~80 train / ~40 eval per task via hard caps
  dataset_fraction: 1.0
  eval_fraction: 1.0
  max_samples_per_task: 80
  max_eval_samples: 40
  eval_batch_size: 0
  task_order:
    - ag_news
    - yelp_review_full
    - amazon_polarity
    - dbpedia_14
    - yahoo_answers_topics
